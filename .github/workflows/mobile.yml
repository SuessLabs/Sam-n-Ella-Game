name: Mobile build

on:
  workflow_dispatch:
  pull_request:
    paths: ['SamElla/**', 'SamElla.Core/**', 'SamElla.Mobile/**', 'SamElla.Tests/**', 'build-mobile.ps1', '.github/workflows/mobile.yml']
  push:
    branches: [develop, master]
    paths: ['SamElla/**', 'SamElla.Core/**', 'SamElla.Mobile/**', 'SamElla.Tests/**', 'build-mobile.ps1', '.github/workflows/mobile.yml']

permissions:
  contents: read

jobs:
  android:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Install mobile workload
        run: dotnet workload install maui-android
      - name: Test shared gameplay and mobile input
        run: dotnet test --project SamElla.Tests/SamElla.Tests.csproj --configuration Release
      - name: Build Android APK
        shell: pwsh
        run: ./build-mobile.ps1 -Configuration Debug
      - name: Check bundled game files
        shell: pwsh
        run: ./scripts/Test-MobilePackage.ps1 -ApkPath Publish/Mobile/android-arm64/com.suesslabs.samella-Signed.apk
